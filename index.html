<title>조성덕</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f7f8fa;
    --text-primary: rgba(10, 14, 20, 0.78);
    --text-secondary: rgba(10, 14, 20, 0.62);
    --text-tertiary: rgba(10, 14, 20, 0.5);
    --border: rgba(10, 14, 20, 0.1);
    --hover: rgba(10, 14, 20, 0.04);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --text-primary: rgba(233, 238, 245, 0.88);
      --text-secondary: rgba(233, 238, 245, 0.66);
      --text-tertiary: rgba(233, 238, 245, 0.5);
      --border: rgba(233, 238, 245, 0.14);
      --hover: rgba(233, 238, 245, 0.06);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Inter Tight", Pretendard, -apple-system, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.75;
    display: flex;
    align-items: center;
    min-height: 100vh;
  }

  main {
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    padding: 3rem 1.75rem;
  }

  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
    letter-spacing: -0.01em;
  }
  .intro {
    color: var(--text-secondary);
    margin: 0 0 2.75rem;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 0.125rem; }
  a.site {
    display: flex;
    align-items: baseline;
    gap: 0.625rem;
    padding: 0.55rem 0.625rem 0.55rem 0.25rem;
    border-radius: 7px;
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }
  a.site:hover { background: var(--hover); }
  .mark { color: var(--text-tertiary); width: 1rem; flex-shrink: 0; }
  .name { font-weight: 500; flex-shrink: 0; }
  .desc { font-size: 0.8125rem; color: var(--text-tertiary); }

  footer {
    margin-top: 2.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 1rem;
  }
  footer a {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    text-decoration: none;
  }
  footer a:hover { color: var(--text-secondary); }

  @media (max-width: 480px) {
    a.site { flex-wrap: wrap; row-gap: 0.125rem; }
    .desc { flex-basis: 100%; padding-left: 1.625rem; }
  }
</style>

    </li>
    <li>

      </a>
    </li>
    <li>
      <a class="site" href="https://ai.sungd.uk">

        <span class="desc">Claude Code·Codex 릴리스에서 오늘 써볼 것</span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/newhigen">GitHub</a>
    <a href="https://linkedin.com/in/sungdukcho">LinkedIn</a>
    <a href="mailto:newhigen@gmail.com">newhigen@gmail.com</a>
  </footer>
</main>
