<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>찾는 쪽이 없습니다 — 조성덕</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f7f8fa;
    --text-primary: rgba(10, 14, 20, 0.78);
    --text-secondary: rgba(10, 14, 20, 0.62);
    --text-tertiary: rgba(10, 14, 20, 0.5);
    --border: rgba(10, 14, 20, 0.1);
    --hover: rgba(10, 14, 20, 0.04);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --text-primary: rgba(233, 238, 245, 0.88);
      --text-secondary: rgba(233, 238, 245, 0.66);
      --text-tertiary: rgba(233, 238, 245, 0.5);
      --border: rgba(233, 238, 245, 0.14);
      --hover: rgba(233, 238, 245, 0.06);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "Inter Tight", Pretendard, -apple-system, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.75;
    display: flex;
    align-items: center;
    min-height: 100vh;
  }

  main {
    width: 100%;
    max-width: 32rem;
    margin: 0 auto;
    padding: 3rem 1.75rem;
  }

  .code {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    letter-spacing: 0.05em;
    margin: 0 0 0.5rem;
  }
  h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin: 0 0 0.75rem;
    letter-spacing: -0.01em;
  }
  .intro {
    color: var(--text-secondary);
    margin: 0 0 1.5rem;
  }
  .intro a {
    color: var(--text-primary);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
  }
  .intro a:hover { border-bottom-color: var(--text-tertiary); }

  .label {
    font-size: 0.8125rem;
    color: var(--text-tertiary);
    margin: 0 0 0.5rem;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 0.125rem; }
  a.site {
    display: flex;
    align-items: baseline;
    gap: 0.625rem;
    padding: 0.55rem 0.625rem 0.55rem 0.25rem;
    border-radius: 7px;
    text-decoration: none;
    color: inherit;
    transition: background-color 0.15s ease;
  }
  a.site:hover { background: var(--hover); }
  .mark { color: var(--text-tertiary); width: 1rem; flex-shrink: 0; }
  .name { font-weight: 500; flex-shrink: 0; }
  .desc { font-size: 0.8125rem; color: var(--text-tertiary); }

  @media (max-width: 480px) {
    a.site { flex-wrap: wrap; row-gap: 0.125rem; }
    .desc { flex-basis: 100%; padding-left: 1.625rem; }
  }
</style>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NM2EX11WS1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  // 내 기기 표시: 어느 사이트든 ?me=1 로 한 번 열면 .sungd.uk 쿠키가 심긴다 (?me=0 으로 해제)
  (function(){
    try {
      var m = new URLSearchParams(location.search).get('me')
      if (m === '1') document.cookie = 'sd_owner=1; domain=.sungd.uk; path=/; max-age=63072000; samesite=lax; secure'
      if (m === '0') document.cookie = 'sd_owner=; domain=.sungd.uk; path=/; max-age=0; samesite=lax; secure'
    } catch (e) {}
    window.__sdOwner = /(?:^|;\s*)sd_owner=1(?:;|$)/.test(document.cookie)
  })();
  gtag('set', 'user_properties', { visitor_type: window.__sdOwner ? 'owner' : 'visitor' });

  gtag('config', 'G-NM2EX11WS1');
  gtag('config', 'G-5LN80GCB37');
</script>
<script>
  // 옛 글 주소는 writing.sungd.uk 의 같은 주소로 바로 넘긴다
  (function () {
    var path = location.pathname;
    if (path === '/' || path === '' || path === '/404.html') return;
    location.replace('https://writing.sungd.uk' + path + location.search + location.hash);
  })();
</script>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>찾는 쪽이 없습니다</h1>
  <p class="intro">
    이 주소에 있던 글은 <a href="https://writing.sungd.uk">writing.sungd.uk</a> 로 옮겼습니다.
    예전 링크나 북마크로 오셨다면 그쪽에 그대로 있습니다.
  </p>

  <p class="label">다른 곳</p>
  <ul>
    <li>
      <a class="site" href="https://resume.sungd.uk">
        <span class="mark">▤</span><span class="name">resume</span>
        <span class="desc">이력서와 만든 것들</span>
      </a>
    </li>
    <li>
      <a class="site" href="https://writing.sungd.uk">
        <span class="mark">¶</span><span class="name">writing</span>
        <span class="desc">책·생각·기술에 대해 쓴 글</span>
      </a>
    </li>
    <li>
      <a class="site" href="https://ai.sungd.uk">
        <span class="mark">✦</span><span class="name">ai</span>
        <span class="desc">Claude Code·Codex 릴리스에서 오늘 써볼 것</span>
      </a>
    </li>
  </ul>
</main>

</body>
</html>
