<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .light-fav { display: block; }
    .dark-fav { display: none; }
    @media (prefers-color-scheme: dark) {
      .light-fav { display: none; }
      .dark-fav { display: block; }
    }
  </style>
  <image class="light-fav" href="data:image/png;base64," width="128" height="128" />
  <image class="dark-fav" href="data:image/png;base64," width="128" height="128" />
</svg>
